<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="القرآن الكريم مع التلاوة والبحث ومواقيت الصلاة والقبلة. by Kareem Emad"><title>القرآن الكريم | by Kareem Emad</title></head><body><p id="status">جارٍ فتح المصحف...</p><noscript>يرجى تفعيل JavaScript لعرض المصحف.</noscript><script src="./content-1.js"></script><script src="./content-2.js"></script><script src="./content-3.js"></script><script>(async()=>{try{const b=Uint8Array.from(atob(window.__quran_payload),c=>c.charCodeAt(0));const t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const page=t.replace('</head>','<link rel="stylesheet" href="./design.css?v=10"></head>').replace('</body>','<script src="./content-divisions.js?v=10"><\/script><script src="./design.js?v=10"><\/script></body>');document.open();document.write(page);document.close()}catch(e){document.getElementById('status').textContent='تعذر فتح الموقع. استخدم متصفحًا حديثًا يدعم DecompressionStream مثل Chrome أو Safari أو Firefox.'}})()</script></body></html>
